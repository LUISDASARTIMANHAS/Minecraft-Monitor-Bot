<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />

    <title>Minecraft Monitor</title>

    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container-fluid p-4">
      <div class="row g-4">
        <div class="col-lg-4">
          <div class="card shadow">
            <div class="card-body">
              <h3>Status</h3>

              <div id="status"></div>
            </div>
          </div>

          <div class="card shadow mt-4">
            <div class="card-body">
              <h3>Chat</h3>

              <div id="chatBox"></div>

              <input
                type="text"
                id="chatInput"
                class="form-control mt-3"
                placeholder="Digite no chat"
              />
            </div>
          </div>

          <div class="card shadow mt-4">
            <div class="card-body">
              <h3>Inventário</h3>

              <div id="inventory"></div>
            </div>
          </div>
        </div>

        <div class="col-lg-8">
          <div class="card shadow">
            <div class="card-body p-0">
              <iframe
                src="http://localhost:3007"
                width="100%"
                height="700"
                frameborder="0"
              >
              </iframe>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="app.js"></script>
  </body>
</html>
