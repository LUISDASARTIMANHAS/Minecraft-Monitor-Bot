<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />

    <title>Minecraft AI Assistant</title>

    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <!-- HEADER -->
    <header class="topbar shadow-lg">
      <div class="container-fluid">
        <div class="d-flex align-items-center justify-content-between flex-wrap gap-3">

          <!-- BRAND -->
          <div class="d-flex align-items-center gap-3">
            <div class="logo-box">
              <i class="bi bi-controller"></i>
            </div>

            <div>
              <h1 class="title">Minecraft AI Assistant</h1>
              <div class="subtitle">Bot autônomo em tempo real</div>
            </div>
          </div>

          <!-- STATS -->
          <div class="stats-grid">

            <!-- SYSTEM -->
            <div class="stat-card">
              <div class="stat-label">Sistema</div>
              <div id="systemStatus" class="stat-value">--</div>
            </div>

            <!-- ONLINE -->
            <div class="stat-card">
              <div class="stat-label">Online</div>
              <div id="onlineStat" class="stat-value">--</div>
            </div>

            <!-- IN GAME -->
            <div class="stat-card">
              <div class="stat-label">Em jogo</div>
              <div id="ingameStat" class="stat-value">--</div>
            </div>

            <!-- HEALTH -->
            <div class="stat-card">
              <div class="stat-label">Vida</div>
              <div id="healthStat" class="stat-value">--</div>
            </div>

            <!-- FOOD -->
            <div class="stat-card">
              <div class="stat-label">Fome</div>
              <div id="foodStat" class="stat-value">--</div>
            </div>

            <!-- XP -->
            <div class="stat-card">
              <div class="stat-label">XP</div>
              <div id="xpStat" class="stat-value">--</div>
            </div>

            <!-- POSITION -->
            <div class="stat-card">
              <div class="stat-label">Posição</div>
              <div id="positionStat" class="stat-small">--</div>
            </div>

          </div>
        </div>
      </div>
    </header>

    <!-- MAIN -->
    <main class="container-fluid py-4">
      <div class="row g-4">

        <!-- LEFT -->
        <div class="col-xl-3">

          <!-- CHAT -->
          <div class="card dashboard-card shadow-lg">
            <div class="card-header-custom">
              <i class="bi bi-chat-dots-fill"></i>
              <span>Chat</span>
            </div>

            <div class="card-body">
              <div id="chatBox"></div>

              <div class="mt-3">
                <input
                  type="text"
                  id="chatInput"
                  class="form-control custom-input"
                  placeholder="Digite no chat..."
                />
              </div>
            </div>
          </div>

          <!-- INVENTORY -->
          <div class="card dashboard-card shadow-lg mt-4">
            <div class="card-header-custom">
              <i class="bi bi-backpack-fill"></i>
              <span>Inventário</span>
            </div>

            <div class="card-body">
              <div id="inventory" class="inventory-grid"></div>
            </div>
          </div>

        </div>

        <!-- RIGHT -->
        <div class="col-xl-9">
          <div class="card dashboard-card shadow-lg viewer-card">

            <div class="card-header-custom">
              <i class="bi bi-badge-3d-fill"></i>
              <span>Viewer 3D</span>
            </div>

            <div class="viewer-wrapper">
              <iframe src="http://localhost:3007" class="viewer-frame"></iframe>
            </div>

          </div>
        </div>

      </div>
    </main>

    <script src="/socket.io/socket.io.js"></script>
    <script src="app.js"></script>
  </body>
</html>
